name: Update medusa DNS
on:
  workflow_dispatch:
jobs:
  update-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Update medusa.casatapputi.com.mx A record
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          VPS_IP="157.151.130.188"
          RECORD_NAME="medusa.casatapputi.com.mx"
          echo "Updating $RECORD_NAME -> $VPS_IP"
          EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records?type=A&name=$RECORD_NAME" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          RECORD_ID=$(echo "$EXISTING" | jq -r '.result[0].id // empty')
          if [ -n "$RECORD_ID" ]; then
            echo "Updating record $RECORD_ID..."
            RESPONSE=$(curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records/$RECORD_ID" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"type":"A","name":"medusa","content":"'"$VPS_IP"'","ttl":1,"proxied":true}')
          else
            echo "Creating new record..."
            RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"type":"A","name":"medusa","content":"'"$VPS_IP"'","ttl":1,"proxied":true}')
          fi
          echo "$RESPONSE" | jq '{success, result: {name: .result.name, type: .result.type, content: .result.content, proxied: .result.proxied}}'
          [ "$(echo "$RESPONSE" | jq -r '.success')" = "true" ] || exit 1
