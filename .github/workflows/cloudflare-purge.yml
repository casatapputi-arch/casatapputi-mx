name: Purge Cloudflare Cache

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.env.example'
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Esperar build de GitHub Pages
        run: |
          echo "Esperando 60 segundos para que GitHub Pages termine el despliegue..."
          sleep 60

      - name: Purge Cache en Cloudflare API v4
        continue-on-error: true
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}')

          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')

          if [ "$SUCCESS" = "true" ]; then
            echo "✅ Caché purgado exitosamente en Cloudflare."
            echo "$RESPONSE" | jq .
          else
            echo "❌ Fallo al purgar el caché. Respuesta de la API:"
            echo "$RESPONSE" | jq .
            exit 1
          fi

  dns-tickets:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Crear/verificar registro DNS tickets.casatapputi.com.mx
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          VPS_IP="129.213.83.24"
          RECORD_NAME="tickets.casatapputi.com.mx"

          echo "🌐 Creando registro A: ${RECORD_NAME} -> ${VPS_IP}"

          EXISTING=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records?type=A&name=$RECORD_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json")

          RECORD_ID=$(echo "$EXISTING" | jq -r '.result[0].id // empty')

          if [ -n "$RECORD_ID" ]; then
            echo "   Actualizando registro $RECORD_ID..."
            RESPONSE=$(curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records/$RECORD_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"A\",\"name\":\"tickets\",\"content\":\"$VPS_IP\",\"ttl\":1,\"proxied\":true}")
          else
            echo "   Creando nuevo registro..."
            RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"A\",\"name\":\"tickets\",\"content\":\"$VPS_IP\",\"ttl\":1,\"proxied\":true}")
          fi

          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          if [ "$SUCCESS" = "true" ]; then
            echo "✅ DNS registrado: $RECORD_NAME -> $VPS_IP (proxied)"
          else
            echo "❌ Error: $(echo "$RESPONSE" | jq -r '.errors[0].message // "unknown"')"
            exit 1
          fi
