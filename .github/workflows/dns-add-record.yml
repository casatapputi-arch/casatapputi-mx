name: Add Ticket DNS Record (OBSOLETO — usar "DNS Sync Origin")

# OBSOLETO 2026-08-07. Tenia la IP del VPS escrita a mano y apuntaba a
# 129.213.83.24, una instancia TERMINADA el 4-ago: ejecutarlo dejaba
# tickets.casatapputi.com.mx sirviendo 521. Se corrige la IP para que no
# haga dano, pero el workflow vigente es dns-sync-origin.yml, que lee el
# estado real y audita antes de aplicar.

on:
  workflow_dispatch:

jobs:
  add-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Crear registro DNS tickets.casatapputi.com.mx
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          VPS_IP="129.153.180.45"   # mosheg-free-2 (origen vigente)
          RECORD_NAME="tickets.casatapputi.com.mx"

          echo "🌐 Creando registro A: ${RECORD_NAME} -> ${VPS_IP}"
          echo "   Zone ID: ${CLOUDFLARE_ZONE_ID:0:8}... (${#CLOUDFLARE_ZONE_ID} chars)"

          # Verificar si ya existe
          EXISTING=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records?type=A&name=$RECORD_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json")

          echo "   Existing check: $(echo "$EXISTING" | jq -r '.result | length') records found"

          RECORD_ID=$(echo "$EXISTING" | jq -r '.result[0].id // empty')

          if [ -n "$RECORD_ID" ]; then
            echo "   Updating record $RECORD_ID..."
            RESPONSE=$(curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records/$RECORD_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"A\",\"name\":\"tickets\",\"content\":\"$VPS_IP\",\"ttl\":1,\"proxied\":true}")
          else
            echo "   Creating new record..."
            RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"A\",\"name\":\"tickets\",\"content\":\"$VPS_IP\",\"ttl\":1,\"proxied\":true}")
          fi

          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          if [ "$SUCCESS" = "true" ]; then
            echo "✅ DNS registrado: $RECORD_NAME -> $VPS_IP (proxied)"
            echo "$RESPONSE" | jq '.result | {name, type, content, proxied}'
          else
            echo "❌ Error: $(echo "$RESPONSE" | jq -r '.errors[0].message // "unknown"')"
            echo "Full response:"
            echo "$RESPONSE" | jq .
            exit 1
          fi

      - name: Purge Cloudflare Cache para el nuevo subdominio
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "🧹 Purgando caché..."
          PURGE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"hosts":["tickets.casatapputi.com.mx"]}')
          echo "$PURGE" | jq -r 'if .success then "✅ Cache purgado" else "⚠️ " + (.errors[0].message // "sin respuesta") end'
