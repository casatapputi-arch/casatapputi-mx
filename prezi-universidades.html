<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mapa Interactivo de Universidades CDMX · EBAC</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Montserrat',sans-serif;background:#1a1a14;touch-action:manipulation}
body{-webkit-user-select:none;user-select:none}

/* ── TOP BAR ── */
#topbar{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(20,20,16,0.95);backdrop-filter:blur(12px);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,0.08)}
#search{flex:1;min-width:160px;padding:10px 14px 10px 36px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#e8e0d0;font-family:'Montserrat',sans-serif;font-size:0.85rem;outline:none;transition:all 0.3s}
#search:focus{border-color:#4a8;background:rgba(255,255,255,0.1)}
#search::placeholder{color:rgba(255,255,255,0.3)}
.search-wrap{position:relative;flex:1;min-width:160px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;opacity:0.35;color:#fff}
.chip{padding:8px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,0.2);background:transparent;color:#b0a890;font-size:0.73rem;cursor:pointer;white-space:nowrap;transition:all 0.3s;font-family:'Montserrat',sans-serif;font-weight:500}
.chip:hover{border-color:#4a8;color:#e8e0d0}
.chip.active{background:#2C8F3E;color:#fff;border-color:#2C8F3E}
#resultsInfo{font-size:0.7rem;color:#888;white-space:nowrap}
#resultsInfo strong{color:#4a8}

/* ── CANVAS ── */
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
#stage{position:absolute;transform-origin:0 0;transition:transform 0.6s cubic-bezier(0.25,0.1,0.25,1)}
#mapSvg{position:absolute;top:0;left:0}
.alcaldia-node{cursor:pointer;transition:all 0.3s}
.alcaldia-node:hover{filter:brightness(1.3)}
.alcaldia-label{pointer-events:none;font-family:'Montserrat',sans-serif;font-weight:600;font-size:11px;fill:#e8e0d0;text-anchor:middle;transition:all 0.3s}
.alcaldia-count{pointer-events:none;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:16px;fill:#fff;text-anchor:middle}
.connector{stroke:rgba(255,255,255,0.1);stroke-width:1.5;fill:none;stroke-dasharray:4 3;transition:all 0.5s}
.connector.active{stroke:rgba(42,140,62,0.4);stroke-dasharray:none;stroke-width:2}
.cdmx-outline{fill:rgba(255,255,255,0.03);stroke:rgba(255,255,255,0.1);stroke-width:1.5}
.bubble-pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{r:22}50%{r:25}}

/* ── CARDS OVERLAY ── */
#overlay{position:fixed;inset:0;z-index:100;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding:20px}
#cardContainer{pointer-events:auto;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px;transition:all 0.5s cubic-bezier(0.25,0.1,0.25,1)}
.uni-card{background:rgba(30,30,22,0.97);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px 16px;width:calc(33.33% - 10px);min-width:250px;cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden}
.uni-card:hover{transform:translateY(-3px);border-color:rgba(42,140,62,0.5);box-shadow:0 12px 30px rgba(0,0,0,0.5)}
.uni-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%}
.uni-card.publica::before{background:#8B5E3C}
.uni-card.privada::before{background:#2C8F3E}
.uni-card .name{font-family:'Cormorant Garamond',serif;font-size:0.95rem;font-weight:600;color:#e8e0d0;margin-bottom:6px;line-height:1.2}
.uni-card .meta{font-size:0.68rem;color:#999;display:flex;flex-wrap:wrap;gap:3px 10px;margin-bottom:4px}
.uni-card .meta span{display:flex;align-items:center;gap:3px}
.uni-card .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{padding:2px 8px;border-radius:4px;font-size:0.6rem;font-weight:600;text-transform:uppercase;letter-spacing:0.3pt}
.tag.publica{background:rgba(139,94,60,0.2);color:#c4956a}
.tag.privada{background:rgba(42,140,62,0.2);color:#4a8}
.tag.ct{background:rgba(42,140,62,0.15);color:#6c6;border:1px solid rgba(42,140,62,0.3)}

/* ── DETAIL MODAL ── */
#detailModal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;cursor:pointer}
#detailModal.open{display:flex}
#detailCard{background:rgba(35,35,28,0.98);border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:24px 28px;max-width:500px;width:100%;cursor:default;position:relative;max-height:80vh;overflow-y:auto}
#detailCard h2{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:#e8e0d0;margin-bottom:4px}
#detailCard .alcaldia-tag{display:inline-block;padding:3px 10px;border-radius:12px;background:rgba(42,140,62,0.2);color:#4a8;font-size:0.7rem;margin-bottom:12px}
#detailCard .info-row{font-size:0.8rem;color:#b0a890;margin:4px 0}
#detailCard .info-row strong{color:#e8e0d0}
#detailCard .carreras{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px}
#detailCard .carrera-tag{padding:3px 10px;border-radius:6px;background:rgba(255,255,255,0.06);color:#ccc;font-size:0.7rem}
#closeBtn{position:absolute;top:12px;right:16px;background:none;border:none;color:#888;font-size:1.5rem;cursor:pointer;z-index:1}

/* ── BACK BUTTON ── */
#backBtn{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:250;background:rgba(30,30,22,0.95);border:1px solid rgba(255,255,255,0.15);color:#e8e0d0;padding:10px 24px;border-radius:24px;font-family:'Montserrat',sans-serif;font-size:0.8rem;cursor:pointer;display:none;backdrop-filter:blur(12px);transition:all 0.3s}
#backBtn:hover{background:rgba(42,140,62,0.3);border-color:#4a8}
#backBtn.visible{display:block}

/* ── MOBILE ── */
@media(max-width:768px){
  .uni-card{width:calc(50% - 8px);min-width:150px;padding:10px 12px}
  .uni-card .name{font-size:0.82rem}
  #topbar{padding:8px 10px;gap:5px}
  #search{font-size:0.78rem;padding:8px 12px 8px 30px}
  .chip{padding:6px 10px;font-size:0.68rem}
  #detailCard{padding:18px 20px}
}
@media(max-width:480px){
  .uni-card{width:100%;min-width:0}
}
</style>
</head>
<body>
<a href="/" style="display:block;background:#1a1814;color:#d4af37;text-align:center;padding:8px;font-family:Montserrat,sans-serif;font-size:0.82rem;text-decoration:none">← Casa Tapputi</a>
<div class="nav-links" hidden></div>
<div class="mobile-menu" hidden></div>

<!-- TOP BAR -->
<div id="topbar">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search" placeholder="Buscar universidad, colonia o alcaldía..." autocomplete="off">
  </div>
  <button class="chip active" data-filter="all">Todos</button>
  <button class="chip" data-filter="Pública">Públicas</button>
  <button class="chip" data-filter="Privada">Privadas</button>
  <button class="chip" data-filter="CT">🎓 Carreras Técnicas</button>
  <span id="resultsInfo">123 unis</span>
</div>

<!-- CANVAS -->
<div id="canvas">
  <div id="stage">
    <svg id="mapSvg" width="1000" height="850" viewBox="0 0 1000 850"></svg>
  </div>
</div>

<!-- CARDS OVERLAY -->
<div id="overlay"><div id="cardContainer"></div></div>

<!-- DETAIL MODAL -->
<div id="detailModal"><div id="detailCard"></div></div>

<!-- BACK BUTTON -->
<button id="backBtn" onclick="zoomOut()">← Volver al mapa</button>

<script>
// ═══════════ DATOS ═══════════
const UNIS = [{"alcaldia":"Álvaro Obregón","nombre":"ITAM — Instituto Tecnológico Autónomo de México","colonia":"Progreso Tizapán","direccion":"Río Hondo 1, Progreso Tizapán, 01080","telefono":"55 5628 4000","tipo":"Privada","servicio_social":"Sí","carreras_tecnicas":"No","n_carreras":15,"carreras":["Actuaría","Administración de Empresas","Ciencia de Datos","Ciencia Política y Relaciones Internacionales","Contaduría Pública","Derecho","Dirección Financiera","Economía","Ingeniería en Computación","Ingeniería en Mecatrónica","Ingeniería en Negocios y Tecnologías de Información","Ingeniería en Telecomunicaciones","Ingeniería Industrial","Matemáticas Aplicadas","Relaciones Internacionales"]},{"alcaldia":"Álvaro Obregón","nombre":"IBERO — Universidad Iberoamericana CDMX","colonia":"Santa Fe","direccion":"Prol. Paseo de la Reforma 880, Lomas de Santa Fe, 01219","telefono":"55 5950 4000","tipo":"Privada","servicio_social":"Sí","carreras_tecnicas":"No","n_carreras":29,"carreras":["Administración de Empresas","Arquitectura","Ciencia Política","Ciencias de la Comunicación","Comercio Internacional","Contaduría y Estrategia Financiera","Derecho","Diseño Gráfico","Diseño Industrial","Diseño Textil","Economía","Filosofía","Historia","Ingeniería Biomédica","Ingeniería Civil","Ingeniería en Sistemas","Ingeniería Física","Ingeniería Industrial","Ingeniería Mecánica","Ingeniería Química","Ingeniería en Alimentos","Literatura","Mercadotecnia","Negocios Internacionales","Nutrición","Pedagogía","Psicología","Relaciones Internacionales","Administración Turística"]},{"alcaldia":"Álvaro Obregón","nombre":"ITESM — Tecnológico de Monterrey Campus Santa Fe","colonia":"Santa Fe","direccion":"Av. Carlos Lazo 100, Santa Fe, 01389","telefono":"55 9177 8000","tipo":"Privada","servicio_social":"Sí","carreras_tecnicas":"No","n_carreras":15,"carreras":["Administración de Empresas","Arquitectura","Comunicación","Derecho","Diseño Industrial","Economía","Finanzas","Ingeniería Biomédica","Ingeniería Civil","Ingeniería en Sistemas Computacionales","Ingeniería Industrial","Ingeniería Mecatrónica","Mercadotecnia","Negocios Internacionales","Relaciones Internacionales"]}];

// Cargar datos completos desde el JSON embebido
fetch('data:application/json,' + encodeURIComponent(JSON.stringify(UNIS)))
  .then(r => r.json())
  .catch(() => {});

// ═══════════ ALCALDÍAS ═══════════
const ALCALDIAS = [
  {id:"cuauhtemoc",name:"Cuauhtémoc",x:500,y:400,r:30},
  {id:"gam",name:"Gustavo A. Madero",x:500,y:220,r:24},
  {id:"azcapotzalco",name:"Azcapotzalco",x:320,y:280,r:20},
  {id:"miguelhidalgo",name:"Miguel Hidalgo",x:260,y:400,r:22},
  {id:"cuajimalpa",name:"Cuajimalpa de Morelos",x:130,y:410,r:18},
  {id:"aobregon",name:"Álvaro Obregón",x:250,y:500,r:24},
  {id:"benitojuarez",name:"Benito Juárez",x:420,y:460,r:24},
  {id:"coyoacan",name:"Coyoacán",x:440,y:540,r:28},
  {id:"mcontreras",name:"Magdalena Contreras",x:300,y:540,r:16},
  {id:"tlalpan",name:"Tlalpan",x:450,y:640,r:22},
  {id:"xochimilco",name:"Xochimilco",x:580,y:620,r:20},
  {id:"tlahuac",name:"Tláhuac",x:680,y:590,r:18},
  {id:"iztapalapa",name:"Iztapalapa",x:620,y:490,r:24},
  {id:"iztacalco",name:"Iztacalco",x:580,y:400,r:18},
  {id:"vcarranza",name:"Venustiano Carranza",x:550,y:350,r:18},
  {id:"milpaalta",name:"Milpa Alta",x:620,y:720,r:16}
];

// Calcular counts por alcaldía (se llenará al cargar datos)
const alcaldiaData = {};
ALCALDIAS.forEach(a => { alcaldiaData[a.name] = {count:0,publicas:0,privadas:0,ct:0,unis:[]}; });

// ═══════════ ESTADO ═══════════
let currentZoom = null;
let currentFilter = 'all';
let currentSearch = '';
let allUniversidades = [];

// ═══════════ INICIALIZACIÓN ═══════════
function init() {
  // Contar universidades por alcaldía
  allUniversidades.forEach(u => {
    const ad = alcaldiaData[u.alcaldia];
    if(ad){ ad.count++; ad.unis.push(u); if(u.tipo==='Pública') ad.publicas++; else ad.privadas++; if(u.carreras_tecnicas==='Sí') ad.ct++; }
  });
  
  // Actualizar radios según cantidad
  ALCALDIAS.forEach(a => {
    const ad = alcaldiaData[a.name];
    if(ad) a.r = Math.max(16, Math.min(36, 10 + ad.count * 0.9));
  });
  
  drawMap();
  updateSearch();
  setupEvents();
}

function drawMap() {
  const svg = document.getElementById('mapSvg');
  
  // Silueta CDMX
  const outline = document.createElementNS('http://www.w3.org/2000/svg','path');
  outline.setAttribute('d','M200,180 Q500,120 800,190 Q900,300 850,450 Q820,600 700,700 Q600,780 500,800 Q400,780 300,700 Q180,600 150,450 Q100,300 200,180Z');
  outline.setAttribute('class','cdmx-outline');
  svg.appendChild(outline);
  
  // Conectores entre alcaldías cercanas
  for(let i=0;i<ALCALDIAS.length;i++){
    for(let j=i+1;j<ALCALDIAS.length;j++){
      const dx = ALCALDIAS[i].x - ALCALDIAS[j].x;
      const dy = ALCALDIAS[i].y - ALCALDIAS[j].y;
      const dist = Math.sqrt(dx*dx+dy*dy);
      if(dist < 180){
        const line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1',ALCALDIAS[i].x);
        line.setAttribute('y1',ALCALDIAS[i].y);
        line.setAttribute('x2',ALCALDIAS[j].x);
        line.setAttribute('y2',ALCALDIAS[j].y);
        line.setAttribute('class','connector');
        if(currentZoom === ALCALDIAS[i].id || currentZoom === ALCALDIAS[j].id) line.classList.add('active');
        svg.appendChild(line);
      }
    }
  }
  
  // Nodos de alcaldías
  ALCALDIAS.forEach(a => {
    const ad = alcaldiaData[a.name];
    const isActive = !currentZoom || currentZoom === a.id;
    const opacity = currentZoom && currentZoom !== a.id ? 0.3 : 1;
    
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','alcaldia-node');
    g.setAttribute('data-id',a.id);
    g.style.opacity = opacity;
    g.addEventListener('click',() => zoomToAlcaldia(a.id));
    
    // Círculo exterior
    const outer = document.createElementNS('http://www.w3.org/2000/svg','circle');
    outer.setAttribute('cx',a.x);
    outer.setAttribute('cy',a.y);
    outer.setAttribute('r',a.r + 6);
    outer.setAttribute('fill','rgba(42,140,62,0.15)');
    outer.setAttribute('stroke','rgba(42,140,62,0.3)');
    outer.setAttribute('stroke-width','2');
    g.appendChild(outer);
    
    // Círculo principal
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',a.x);
    circle.setAttribute('cy',a.y);
    circle.setAttribute('r',a.r);
    const grad = `url(#grad-${a.id})`;
    circle.setAttribute('fill',currentZoom===a.id?'#2C8F3E':'#3a3a2a');
    circle.setAttribute('stroke',currentZoom===a.id?'#4a8':'rgba(255,255,255,0.2)');
    circle.setAttribute('stroke-width','2');
    if(currentZoom===a.id) circle.classList.add('bubble-pulse');
    g.appendChild(circle);
    
    // Número
    const count = document.createElementNS('http://www.w3.org/2000/svg','text');
    count.setAttribute('x',a.x);
    count.setAttribute('y',a.y + 5);
    count.setAttribute('class','alcaldia-count');
    count.textContent = ad ? ad.count : 0;
    g.appendChild(count);
    
    // Label
    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x',a.x);
    label.setAttribute('y',a.y + a.r + 16);
    label.setAttribute('class','alcaldia-label');
    label.textContent = a.name;
    g.appendChild(label);
    
    svg.appendChild(g);
  });
}

// ═══════════ ZOOM ═══════════
function zoomToAlcaldia(id) {
  currentZoom = id;
  const a = ALCALDIAS.find(x => x.id === id);
  if(!a) return;
  
  // Re-draw map
  document.getElementById('mapSvg').innerHTML = '';
  drawMap();
  
  // Zoom animation
  const stage = document.getElementById('stage');
  const w = window.innerWidth;
  const h = window.innerHeight;
  const scale = 2.2;
  const tx = w/2 - a.x * scale;
  const ty = h/2 - a.y * scale;
  stage.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  
  // Show cards
  showCards(a.name);
  document.getElementById('backBtn').classList.add('visible');
  
  // Highlight connectors
  document.querySelectorAll('.connector').forEach(l => l.classList.add('active'));
}

function zoomOut() {
  currentZoom = null;
  document.getElementById('mapSvg').innerHTML = '';
  drawMap();
  document.getElementById('stage').style.transform = 'translate(0,0) scale(1)';
  document.getElementById('cardContainer').innerHTML = '';
  document.getElementById('backBtn').classList.remove('visible');
  updateSearch();
}

// ═══════════ CARDS ─══════════
function showCards(alcaldiaName) {
  const ad = alcaldiaData[alcaldiaName];
  if(!ad) return;
  
  let unis = ad.unis;
  if(currentFilter !== 'all') {
    if(currentFilter === 'CT') unis = unis.filter(u => u.carreras_tecnicas === 'Sí');
    else unis = unis.filter(u => u.tipo === currentFilter);
  }
  if(currentSearch) {
    const q = currentSearch.toLowerCase();
    unis = unis.filter(u => 
      u.nombre.toLowerCase().includes(q) || 
      u.colonia.toLowerCase().includes(q) || 
      u.direccion.toLowerCase().includes(q) ||
      u.carreras.some(c => c.toLowerCase().includes(q))
    );
  }
  
  const container = document.getElementById('cardContainer');
  if(!unis.length) {
    container.innerHTML = `<div style="text-align:center;color:#888;padding:20px;width:100%;font-size:0.9rem">No se encontraron universidades con esos filtros.</div>`;
    return;
  }
  container.innerHTML = unis.map(u => `
    <div class="uni-card ${u.tipo === 'Pública' ? 'publica' : 'privada'}" onclick="showDetail('${u.nombre.replace(/'/g,"\\'")}')">
      <div class="name">${u.nombre}</div>
      <div class="meta">
        <span>📍 ${u.colonia}</span>
        <span>📞 ${u.telefono}</span>
        <span>📚 ${u.n_carreras} carreras</span>
      </div>
      <div class="tags">
        <span class="tag ${u.tipo === 'Pública' ? 'publica' : 'privada'}">${u.tipo}</span>
        ${u.carreras_tecnicas === 'Sí' ? '<span class="tag ct">Carreras Técnicas</span>' : ''}
      </div>
    </div>
  `).join('');
}

function showDetail(nombre) {
  const u = allUniversidades.find(x => x.nombre === nombre);
  if(!u) return;
  
  document.getElementById('detailCard').innerHTML = `
    <button id="closeBtn" onclick="closeDetail()">✕</button>
    <h2>${u.nombre}</h2>
    <span class="alcaldia-tag">🏙️ ${u.alcaldia}</span>
    <div class="info-row"><strong>📍</strong> ${u.direccion}</div>
    <div class="info-row"><strong>🏘️</strong> ${u.colonia}</div>
    <div class="info-row"><strong>📞</strong> ${u.telefono}</div>
    <div class="info-row"><strong>🏛️</strong> ${u.tipo} · ${u.n_carreras} carreras · Servicio Social: ${u.servicio_social}${u.carreras_tecnicas === 'Sí' ? ' · Carreras Técnicas' : ''}</div>
    <div class="carreras">${u.carreras.map(c => `<span class="carrera-tag">${c}</span>`).join('')}</div>
  `;
  document.getElementById('detailModal').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailModal').classList.remove('open');
}

// ═══════════ SEARCH & FILTERS ═══════════
function updateSearch() {
  currentSearch = document.getElementById('search').value;
  if(currentZoom) {
    const a = ALCALDIAS.find(x => x.id === currentZoom);
    if(a) showCards(a.name);
  } else {
    // Global view: highlight matching alcaldías
    refreshMapHighlights();
  }
  updateResultsInfo();
}

function refreshMapHighlights() {
  const q = currentSearch.toLowerCase();
  let matchIds = new Set();
  if(q) {
    allUniversidades.forEach(u => {
      if(u.nombre.toLowerCase().includes(q) || u.colonia.toLowerCase().includes(q) || u.direccion.toLowerCase().includes(q) || u.carreras.some(c => c.toLowerCase().includes(q))) {
        const a = ALCALDIAS.find(x => x.name === u.alcaldia);
        if(a) matchIds.add(a.id);
      }
    });
  }
  document.querySelectorAll('.alcaldia-node').forEach(g => {
    const id = g.getAttribute('data-id');
    if(!q) { g.style.opacity = 1; g.style.filter = ''; return; }
    if(matchIds.has(id)) { g.style.opacity = 1; g.style.filter = 'brightness(1.4)'; }
    else { g.style.opacity = 0.25; g.style.filter = ''; }
  });
}

function getFilteredCount() {
  let unis = allUniversidades;
  if(currentFilter !== 'all') {
    if(currentFilter === 'CT') unis = unis.filter(u => u.carreras_tecnicas === 'Sí');
    else unis = unis.filter(u => u.tipo === currentFilter);
  }
  if(currentSearch) {
    const q = currentSearch.toLowerCase();
    unis = unis.filter(u => u.nombre.toLowerCase().includes(q) || u.colonia.toLowerCase().includes(q) || u.direccion.toLowerCase().includes(q) || u.carreras.some(c => c.toLowerCase().includes(q)));
  }
  if(currentZoom) {
    const a = ALCALDIAS.find(x => x.id === currentZoom);
    unis = unis.filter(u => u.alcaldia === (a ? a.name : ''));
  }
  return unis.length;
}

function updateResultsInfo() {
  const total = getFilteredCount();
  const info = document.getElementById('resultsInfo');
  info.innerHTML = `<strong>${total}</strong> ${total === 1 ? 'uni' : 'unis'}`;
}

// ═══════════ EVENTS ═══════════
function setupEvents() {
  document.getElementById('search').addEventListener('input', updateSearch);
  
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', function() {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      this.classList.add('active');
      currentFilter = this.dataset.filter;
      if(currentZoom) {
        const a = ALCALDIAS.find(x => x.id === currentZoom);
        if(a) showCards(a.name);
      } else {
        refreshMapHighlights();
      }
      updateSearch();
    });
  });
  
  document.getElementById('detailModal').addEventListener('click', function(e) {
    if(e.target === this) closeDetail();
  });
  
  // Pinch zoom on mobile
  let lastDist = 0;
  document.addEventListener('touchstart', e => {
    if(e.touches.length === 2) {
      lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
  });
  document.addEventListener('touchmove', e => {
    if(e.touches.length === 2 && !currentZoom) {
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if(dist > lastDist * 1.3) {
        if(currentZoom) { zoomOut(); lastDist = dist; return; }
        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        let closest = null, minDist = Infinity;
        ALCALDIAS.forEach(a => {
          const d = Math.hypot(cx - a.x, cy - a.y);
          if(d < minDist){ minDist = d; closest = a; }
        });
        if(closest && minDist < 200) zoomToAlcaldia(closest.id);
      }
    }
  });
}
